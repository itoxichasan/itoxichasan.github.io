<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111; color: white; }
.text-dash {
  animation: textDashArray 2s ease-in-out infinite, textDashOffset 2s linear infinite;
}
@keyframes textDashArray {
  0% { stroke-dasharray: 0 1 200 0; }
  50% { stroke-dasharray: 0 200 1 0; }
  100% { stroke-dasharray: 200 1 0 0; }
}
@keyframes textDashOffset {
  0% { stroke-dashoffset: 200; }
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
  <svg viewBox="0 0 500 100" width="100%" height="100px">
    <defs>
      <linearGradient y2="2" x2="0" y1="62" x1="0" id="grad-b">
        <stop stop-color="#973BED"></stop>
        <stop stop-color="#007CFF" offset="1"></stop>
      </linearGradient>
      <linearGradient y2="0" x2="0" y1="64" x1="0" id="grad-c">
        <stop stop-color="#FFC800"></stop>
        <stop stop-color="#F0F" offset="1"></stop>
      </linearGradient>
      <linearGradient y2="2" x2="0" y1="62" x1="0" id="grad-d">
        <stop stop-color="#00E0ED"></stop>
        <stop stop-color="#00DA72" offset="1"></stop>
      </linearGradient>
    </defs>
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="50" font-family="Arial, sans-serif" font-weight="900" fill="none" stroke-width="2">
      <tspan stroke="url(#grad-b)" class="text-dash">T</tspan>
      <tspan stroke="url(#grad-c)" class="text-dash">O</tspan>
      <tspan stroke="url(#grad-d)" class="text-dash">X</tspan>
      <tspan stroke="url(#grad-b)" class="text-dash">I</tspan>
      <tspan stroke="url(#grad-c)" class="text-dash">C</tspan>
      <tspan> </tspan>
      <tspan stroke="url(#grad-d)" class="text-dash">H</tspan>
      <tspan stroke="url(#grad-b)" class="text-dash">A</tspan>
      <tspan stroke="url(#grad-c)" class="text-dash">S</tspan>
      <tspan stroke="url(#grad-d)" class="text-dash">A</tspan>
      <tspan stroke="url(#grad-b)" class="text-dash">N</tspan>
    </text>
  </svg>
</body>
</html>
